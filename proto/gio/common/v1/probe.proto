syntax = "proto3";

package gio.common.v1;

// ProbeLocation is declared geographic context, not inferred IP geolocation.
message ProbeLocation {
  // Uppercase ISO 3166-1 alpha-2 country code (two ASCII letters), when known.
  optional string country_code = 1;

  // The ISO 3166-2 subdivision code without the country prefix, when known.
  optional string subdivision_code = 2;

  // A human-readable locality name, when known.
  optional string locality = 3;
}

// ProbeContext identifies the probe and software that produced a measurement.
message ProbeContext {
  // Non-empty, stable, opaque probe identifier in the producer's GIO identity
  // namespace. It must not be inferred from software, deployment, or IP address.
  string probe_id = 1;

  // Opaque installation/deployment identifier, when distinct from probe identity.
  // Reinstallation may change this without changing the logical probe identity.
  optional string deployment_id = 2;

  // Producer-reported software identity. No package ecosystem is implied.
  optional string software_name = 3;
  // Producer-reported version text; no semantic-version syntax is required.
  optional string software_version = 4;
  optional ProbeLocation location = 5;
}
