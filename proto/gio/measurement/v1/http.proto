syntax = "proto3";

package gio.measurement.v1;

import "google/protobuf/duration.proto";

// HttpHeader preserves one HTTP header field.
message HttpHeader {
  string name = 1;
  bytes value = 2;
}

// HttpResult is the final response from one completed HTTP transaction.
message HttpResult {
  // Uppercase HTTP request method used for the transaction, for example "GET".
  string method = 1;

  // Absolute URL of the final response after any redirects followed by the probe.
  string final_url = 2;

  // HTTP response status code in the inclusive range 100 through 599.
  uint32 status_code = 3;

  // Header order and repeated field names are preserved.
  repeated HttpHeader response_headers = 4;

  // Response body bytes after HTTP content-transfer decoding. Content codings are
  // not implicitly removed and remain described by the response headers.
  bytes body = 5;

  // Time from starting the transaction until receipt of the final response body,
  // including followed redirects.
  google.protobuf.Duration elapsed = 6;
}
