name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buf:
    name: Buf checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect schema-relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$head")"
          else
            changed_files="$(git diff --name-only "$base" "$head")"
          fi

          printf '%s\n' "$changed_files"

          relevant=false
          while IFS= read -r file; do
            case "$file" in
              proto/*.proto|buf.yaml|buf.lock|Makefile|scripts/*|.github/workflows/ci.yml)
                relevant=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Documentation-only change
        if: steps.changes.outputs.relevant != 'true'
        run: echo 'No schema or schema-tooling changes detected; Buf checks are skipped.'

      - name: Detect schema files
        if: steps.changes.outputs.relevant == 'true'
        id: schema
        shell: bash
        run: |
          if find proto -type f -name '*.proto' -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Buf
        if: steps.changes.outputs.relevant == 'true'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: '1.72.0'
          setup_only: true

      - name: Detect base schema files
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true'
        id: base-schema
        shell: bash
        run: |
          if git ls-tree -r --name-only '${{ github.event.pull_request.base.sha }}' -- proto | grep -q '\.proto$'; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap state
        if: steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present != 'true'
        run: echo 'No .proto files yet; schema checks are intentionally skipped.'

      - name: Check formatting
        if: steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true'
        run: buf format --diff --exit-code

      - name: Lint
        if: steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true'
        run: buf lint

      - name: Build schema
        if: steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true'
        run: buf build

      - name: No breaking baseline yet
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true' && steps.base-schema.outputs.present != 'true'
        run: echo 'The base commit has no .proto files yet; breaking-change checks start after the first schema lands.'

      - name: Check breaking changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.relevant == 'true' && steps.schema.outputs.present == 'true' && steps.base-schema.outputs.present == 'true'
        run: buf breaking --against '.git#ref=${{ github.event.pull_request.base.sha }}'
